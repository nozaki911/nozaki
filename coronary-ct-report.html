<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>冠動脈CTテンプレート</title>

<style>
body{
    font-family:sans-serif;
    margin:20px;
    max-width:1200px;
}

.section{
    margin-bottom:20px;
}

label{
    display:inline-block;
    width:100px;
}

.stenosis-row{
    margin-bottom:5px;
}

textarea{
    width:100%;
    height:300px;
}

button{
    margin:5px;
    padding:8px 12px;
}

.numeric-pad {
    display:grid;
    grid-template-columns: repeat(3, 45px);
    gap:3px;
}

.numeric-pad button {
    width:45px;
    height:38px;
    font-size:14px;
    margin:0;
    padding:0;
}

.numeric-pad button.delete {
    grid-column: span 3;
    font-size:12px;
}

.numeric-input-container {
    display:flex;
    gap:10px;
    align-items:center;
}

.numeric-input {
    font-size:18px;
    min-width:60px;
    padding:5px;
    border:1px solid #ccc;
    text-align:center;
}

.input-label {
    display:inline-block;
    width:60px;
    font-weight:bold;
}

/* 造影剤量セクション */
.volume-section {
    display:grid;
    grid-template-columns: 1fr auto;
    gap:20px;
    align-items:start;
    margin-bottom:30px;
}

/* 心拍セクション */
.heartrate-section {
    display:grid;
    grid-template-columns: 1fr auto auto;
    gap:20px;
    align-items:start;
    margin-bottom:30px;
}

.heartrate-input {
    display:flex;
    flex-direction:column;
    gap:10px;
}

.heartrate-pads {
    display:grid;
    grid-template-columns: auto auto;
    gap:15px;
}

.heartrate-pad-label {
    font-size:12px;
    font-weight:bold;
    color:#666;
}

/* 血圧セクション */
.bp-section {
    display:grid;
    grid-template-columns: auto 1fr;
    gap:20px;
}

.bp-label {
    display:flex;
    align-items:center;
    font-weight:bold;
}

.bp-content {
    display:flex;
    flex-direction:column;
    gap:15px;
}

.bp-row {
    display:grid;
    grid-template-columns: auto auto;
    gap:20px;
    align-items:start;
}

.bp-input-group {
    display:flex;
    flex-direction:column;
    gap:5px;
}

.bp-input-label {
    font-size:12px;
    font-weight:bold;
}

.bp-pads {
    display:grid;
    grid-template-columns: auto auto;
    gap:15px;
}

.bp-pad-label {
    font-size:12px;
    color:#666;
}
</style>
</head>

<body>

<h2>冠動脈CTレポート作成</h2>

<div class="section">
    <label>CT装置</label>
    <select id="scanner">
        <option>iCT</option>
        <option>IQon</option>
        <option>7500</option>
    </select>
</div>

<div class="section">
    <label>造影剤</label>
    <select id="contrast">
        <option>オプチレイ</option>
        <option>イオパミロン</option>
        <option>イオプロミド</option>
        <option>イオパミドール</option>
        <option>オムニパーク</option>
        <option>イオメロン</option>
    </select>
</div>

<hr>

<h3>撮影時条件</h3>

<div class="section">
    <label>呼吸止め</label>
    <select id="breath">
        <option>可</option>
        <option>不良</option>
        <option>不可</option>
    </select>
</div>

<div class="section">
    <label>βブロッカー</label>
    <select id="betaBlocker" onchange="toggleBetaBlockerDetails()">
        <option>なし</option>
        <option>あり</option>
    </select>
    <div id="betaBlockerDetails" style="display:none; margin-top:15px;">
        <div style="margin-bottom:10px;">
            <label>pre BP:</label>
            <div class="numeric-input-container">
                <input type="text" id="bpPreDisplay1" class="numeric-input" readonly>
                <span>/</span>
                <input type="text" id="bpPreDisplay2" class="numeric-input" readonly>
            </div>
        </div>
    </div>
</div>

<hr>

<h3>電卓入力</h3>

<!-- 造影剤量 -->
<div class="volume-section">
    <div>
        <label style="display:block; margin-bottom:5px;">造影剤量</label>
        <div class="numeric-input-container">
            <input type="text" id="volume" class="numeric-input" readonly>
            <span>cc</span>
        </div>
    </div>
    <div class="numeric-pad" id="volumePad"></div>
</div>

<!-- 心拍 -->
<div class="heartrate-section">
    <div class="heartrate-input">
        <label style="display:block; margin-bottom:5px;">心拍</label>
        <div class="numeric-input-container">
            <span class="input-label">前:</span>
            <input type="text" id="heartRate1" class="numeric-input" readonly>
            <span>-</span>
            <span class="input-label">後:</span>
            <input type="text" id="heartRate2" class="numeric-input" readonly>
            <span>bpm</span>
        </div>
    </div>
    <div class="heartrate-pads">
        <div>
            <div class="heartrate-pad-label">前</div>
            <div class="numeric-pad" id="heartRatePad1"></div>
        </div>
        <div>
            <div class="heartrate-pad-label">後</div>
            <div class="numeric-pad" id="heartRatePad2"></div>
        </div>
    </div>
</div>

<!-- 血圧電卓 -->
<div id="bpPadsContainer" style="display:none; margin-top:20px; margin-bottom:30px;">
    <div class="bp-section">
        <div class="bp-label">血圧</div>
        <div class="bp-content">
            <!-- 前 -->
            <div class="bp-row">
                <div class="bp-input-group">
                    <div class="bp-input-label">pre (上/下):</div>
                    <div class="numeric-input-container">
                        <input type="text" id="bpPre1" class="numeric-input" readonly>
                        <span>/</span>
                        <input type="text" id="bpPre2" class="numeric-input" readonly>
                    </div>
                </div>
                <div class="bp-pads">
                    <div>
                        <div class="bp-pad-label">上</div>
                        <div class="numeric-pad" id="bpPrePad1"></div>
                    </div>
                    <div>
                        <div class="bp-pad-label">下</div>
                        <div class="numeric-pad" id="bpPrePad2"></div>
                    </div>
                </div>
            </div>
            <!-- 後 -->
            <div class="bp-row">
                <div class="bp-input-group">
                    <div class="bp-input-label">post (上/下):</div>
                    <div class="numeric-input-container">
                        <input type="text" id="bpPost1" class="numeric-input" readonly>
                        <span>/</span>
                        <input type="text" id="bpPost2" class="numeric-input" readonly>
                    </div>
                </div>
                <div class="bp-pads">
                    <div>
                        <div class="bp-pad-label">上</div>
                        <div class="numeric-pad" id="bpPostPad1"></div>
                    </div>
                    <div>
                        <div class="bp-pad-label">下</div>
                        <div class="numeric-pad" id="bpPostPad2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<hr>

<h3>冠動脈狭窄</h3>

<div id="stenosisContainer"></div>

<button onclick="addStenosis()">＋狭窄追加</button>

<hr>

<h3>その他所見</h3>

<label><input type="checkbox" value="肝嚢胞">肝嚢胞</label><br>
<label><input type="checkbox" value="腎嚢胞">腎嚢胞</label><br>
<label><input type="checkbox" value="脂肪肝">脂肪肝</label><br>
<label><input type="checkbox" value="胆石">胆石</label><br>
<label><input type="checkbox" value="胸水">胸水</label><br>

<hr>

<div class="section">
    <label>担当者</label>
    <input type="text" id="operator" value="">
</div>

<button onclick="generateReport()">文章生成</button>
<button onclick="copyReport()">コピー</button>

<hr>

<textarea id="output"></textarea>

<script>

function createNumericPad(containerId, targetFieldId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    
    for(let i = 1; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.onclick = () => appendToInput(targetFieldId, i);
        container.appendChild(btn);
    }
    
    const zeroBtn = document.createElement('button');
    zeroBtn.textContent = '0';
    zeroBtn.onclick = () => appendToInput(targetFieldId, 0);
    container.appendChild(zeroBtn);
    
    const clearBtn = document.createElement('button');
    clearBtn.textContent = 'クリア';
    clearBtn.className = 'delete';
    clearBtn.onclick = () => clearInput(targetFieldId);
    container.appendChild(clearBtn);
}

function appendToInput(fieldId, value) {
    const field = document.getElementById(fieldId);
    field.value = field.value + value;
}

function clearInput(fieldId) {
    document.getElementById(fieldId).value = '';
}

function toggleBetaBlockerDetails() {
    const betaBlocker = document.getElementById("betaBlocker").value;
    const details = document.getElementById("betaBlockerDetails");
    const padsContainer = document.getElementById("bpPadsContainer");
    if(betaBlocker === "あり") {
        details.style.display = "block";
        padsContainer.style.display = "block";
        if(document.getElementById("bpPrePad1").children.length === 0) {
            createNumericPad("bpPrePad1", "bpPre1");
            createNumericPad("bpPrePad2", "bpPre2");
            createNumericPad("bpPostPad1", "bpPost1");
            createNumericPad("bpPostPad2", "bpPost2");
        }
    } else {
        details.style.display = "none";
        padsContainer.style.display = "none";
    }
}

function addStenosis(){

    const container = document.getElementById("stenosisContainer");

    const row = document.createElement("div");
    row.className = "stenosis-row";

    row.innerHTML = `
        <select class="segment">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>HL</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
            <option>15</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4AV</option>
            <option>4PD</option>
        </select>

        <select class="rate">
            <option>25%</option>
            <option>50%</option>
            <option>75%</option>
            <option>90%</option>
        </select>

        <button onclick="this.parentElement.remove()">削除</button>
    `;

    container.appendChild(row);
}

addStenosis();

// 初期化：各パッド作成
createNumericPad("volumePad", "volume");
createNumericPad("heartRatePad1", "heartRate1");
createNumericPad("heartRatePad2", "heartRate2");

function generateReport(){

    let text = "";

    text += "CT所見【" + document.getElementById("scanner").value + "】\n\n";

    text += "撮影時\n";

    const hr1 = document.getElementById("heartRate1").value;
    const hr2 = document.getElementById("heartRate2").value;
    text += "　心拍　　　　　";
    if(hr1 || hr2) {
        text += (hr1 || "xx") + "-" + (hr2 || "yy") + " bpm\n";
    } else {
        text += "xx-yy bpm\n";
    }

    const betaBlocker = document.getElementById("betaBlocker").value;
    text += "　βブロッカー　　";
    if(betaBlocker === "あり") {
        const bpPre1 = document.getElementById("bpPre1").value || "xxx";
        const bpPre2 = document.getElementById("bpPre2").value || "yyy";
        const bpPost1 = document.getElementById("bpPost1").value || "zzz";
        const bpPost2 = document.getElementById("bpPost2").value || "www";
        text += "あり(BP:pre" + bpPre1 + "/" + bpPre2 + ", post" + bpPost1 + "/" + bpPost2 + ")\n";
    } else {
        text += "なし\n";
    }

    text += "　呼吸止め　　　　" + document.getElementById("breath").value + "\n";
    text += "　使用造影剤　　　" + document.getElementById("contrast").value + "\n";
    
    const volume = document.getElementById("volume").value;
    text += "　造影剤使用量　　" + (volume || "60") + " CC\n\n";

    const segments = document.querySelectorAll(".stenosis-row");

    if(segments.length > 0){

        text += "■冠動脈\n\n";

        // セグメントをグループに分類
        const group1 = []; // 5-10
        const hlGroup = []; // HL
        const group2 = []; // 11-15
        const group3 = []; // 1-4AV-4PD

        segments.forEach(row => {
            const seg = row.querySelector(".segment").value;
            const rate = row.querySelector(".rate").value;
            const item = "#" + seg + ": " + rate;

            if(['5','6','7','8','9','10'].includes(seg)) {
                group1.push(item);
            } else if(seg === 'HL') {
                hlGroup.push(item);
            } else if(['11','12','13','14','15'].includes(seg)) {
                group2.push(item);
            } else {
                group3.push(item);
            }
        });

        // グループごとに出力
        if(group1.length > 0) {
            text += group1.join("\n") + "\n\n";
        }
        if(hlGroup.length > 0) {
            text += hlGroup.join("\n") + "\n\n";
        }
        if(group2.length > 0) {
            text += group2.join("\n") + "\n\n";
        }
        if(group3.length > 0) {
            text += group3.join("\n") + "\n\n";
        }

        text += "程度の狭窄が疑われます\n\n";
    }

    const findings = document.querySelectorAll(
        'input[type="checkbox"]:checked'
    );

    findings.forEach(item=>{
        text += item.value + "\n";
    });

    if(findings.length > 0){
        text += "\n";
    }

    const operator = document.getElementById("operator").value.trim();

    if(operator){
        text += "-----------------\n";
        text += operator + " 処理";
    }

    document.getElementById("output").value = text;
}

function copyReport(){

    const output = document.getElementById("output");

    output.select();
    navigator.clipboard.writeText(output.value);

    alert("コピーしました");
}

</script>

</body>
</html>
