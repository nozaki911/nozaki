<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>冠動脈CTテンプレート</title>

<style>
body{
    font-family:sans-serif;
    margin:20px;
    max-width:900px;
}

.section{
    margin-bottom:20px;
}

label{
    display:inline-block;
    width:100px;
}

.stenosis-row{
    margin-bottom:5px;
}

textarea{
    width:100%;
    height:300px;
}

button{
    margin:5px;
    padding:8px 12px;
}

.numeric-pad {
    display:grid;
    grid-template-columns: repeat(3, 60px);
    gap:5px;
    margin-top:10px;
}

.numeric-pad button {
    width:60px;
    height:50px;
    font-size:16px;
    margin:0;
    padding:0;
}

.numeric-pad button.delete {
    grid-column: span 3;
}

.numeric-input-container {
    display:flex;
    gap:10px;
    align-items:center;
}

.numeric-input {
    font-size:18px;
    min-width:60px;
    padding:5px;
    border:1px solid #ccc;
    text-align:center;
}

.input-label {
    display:inline-block;
    width:60px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>冠動脈CTレポート作成</h2>

<div class="section">
    <label>CT装置</label>
    <select id="scanner">
        <option>iCT</option>
        <option>IQon</option>
        <option>7500</option>
    </select>
</div>

<div class="section">
    <label>造影剤</label>
    <select id="contrast">
        <option>オプチレイ</option>
        <option>イオパミロン</option>
        <option>イオプロミド</option>
        <option>イオパミドール</option>
        <option>オムニパーク</option>
        <option>イオメロン</option>
    </select>
</div>

<div class="section">
    <label>造影剤量</label>
    <input type="number" id="volume" value="60"> cc
</div>

<hr>

<h3>撮影時条件</h3>

<div class="section">
    <label>心拍</label>
    <div class="numeric-input-container">
        <span class="input-label">開始:</span>
        <input type="text" id="heartRate1" class="numeric-input" readonly>
        <span>-</span>
        <span class="input-label">終了:</span>
        <input type="text" id="heartRate2" class="numeric-input" readonly>
        <span>bpm</span>
    </div>
    <div class="numeric-pad" id="heartRatePad1"></div>
</div>

<div class="section">
    <label>βブロッカー</label>
    <select id="betaBlocker" onchange="toggleBetaBlockerDetails()">
        <option>なし</option>
        <option>あり</option>
    </select>
    <div id="betaBlockerDetails" style="display:none; margin-top:15px;">
        <div style="margin-bottom:10px;">
            <label>使用前BP:</label>
            <div class="numeric-input-container">
                <input type="text" id="bpPre1" class="numeric-input" readonly>
                <span>/</span>
                <input type="text" id="bpPre2" class="numeric-input" readonly>
            </div>
            <div class="numeric-pad" id="bpPrePad"></div>
        </div>
        <div>
            <label>使用後BP:</label>
            <div class="numeric-input-container">
                <input type="text" id="bpPost1" class="numeric-input" readonly>
                <span>/</span>
                <input type="text" id="bpPost2" class="numeric-input" readonly>
            </div>
            <div class="numeric-pad" id="bpPostPad"></div>
        </div>
    </div>
</div>

<div class="section">
    <label>呼吸止め</label>
    <select id="breath">
        <option>可</option>
        <option>不良</option>
        <option>不可</option>
    </select>
</div>

<hr>

<h3>冠動脈狭窄</h3>

<div id="stenosisContainer"></div>

<button onclick="addStenosis()">＋狭窄追加</button>

<hr>

<h3>その他所見</h3>

<label><input type="checkbox" value="肝嚢胞">肝嚢胞</label><br>
<label><input type="checkbox" value="腎嚢胞">腎嚢胞</label><br>
<label><input type="checkbox" value="脂肪肝">脂肪肝</label><br>
<label><input type="checkbox" value="胆石">胆石</label><br>
<label><input type="checkbox" value="胸水">胸水</label><br>

<hr>

<div class="section">
    <label>担当者</label>
    <input type="text" id="operator" value="">
</div>

<button onclick="generateReport()">文章生成</button>
<button onclick="copyReport()">コピー</button>

<hr>

<textarea id="output"></textarea>

<script>

let currentInputField = null;

function createNumericPad(containerId, targetFieldId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    
    for(let i = 1; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.onclick = () => appendToInput(targetFieldId, i);
        container.appendChild(btn);
    }
    
    const zeroBtn = document.createElement('button');
    zeroBtn.textContent = '0';
    zeroBtn.onclick = () => appendToInput(targetFieldId, 0);
    container.appendChild(zeroBtn);
    
    const clearBtn = document.createElement('button');
    clearBtn.textContent = 'クリア';
    clearBtn.className = 'delete';
    clearBtn.onclick = () => clearInput(targetFieldId);
    container.appendChild(clearBtn);
}

function appendToInput(fieldId, value) {
    const field = document.getElementById(fieldId);
    field.value = field.value + value;
}

function clearInput(fieldId) {
    document.getElementById(fieldId).value = '';
}

function toggleBetaBlockerDetails() {
    const betaBlocker = document.getElementById("betaBlocker").value;
    const details = document.getElementById("betaBlockerDetails");
    if(betaBlocker === "あり") {
        details.style.display = "block";
        if(document.getElementById("bpPrePad").children.length === 0) {
            createNumericPad("bpPrePad", "bpPre1");
            createNumericPad("bpPostPad", "bpPost1");
        }
    } else {
        details.style.display = "none";
    }
}

function addStenosis(){

    const container = document.getElementById("stenosisContainer");

    const row = document.createElement("div");
    row.className = "stenosis-row";

    row.innerHTML = `
        <select class="segment">
            <option>#1</option>
            <option>#2</option>
            <option>#3</option>
            <option>#4</option>
            <option>#5</option>
            <option>#6</option>
            <option>#7</option>
            <option>#8</option>
            <option>#9</option>
            <option>#10</option>
            <option>#11</option>
            <option>#12</option>
            <option>#13</option>
            <option>#14</option>
            <option>#15</option>
        </select>

        <select class="rate">
            <option>25%</option>
            <option>50%</option>
            <option>75%</option>
            <option>90%</option>
        </select>

        <button onclick="this.parentElement.remove()">削除</button>
    `;

    container.appendChild(row);
}

addStenosis();

// 初期化：心拍数パッド作成
createNumericPad("heartRatePad1", "heartRate1");

function generateReport(){

    let text = "";

    text += "CT所見\n\n";

    text += "撮影時\n";

    const hr1 = document.getElementById("heartRate1").value;
    const hr2 = document.getElementById("heartRate2").value;
    text += "　心拍　　　　　";
    if(hr1 || hr2) {
        text += (hr1 || "xx") + "-" + (hr2 || "yy") + " bpm\n";
    } else {
        text += "xx-yy bpm\n";
    }

    const betaBlocker = document.getElementById("betaBlocker").value;
    text += "　βブロッカー　　";
    if(betaBlocker === "あり") {
        const bpPre1 = document.getElementById("bpPre1").value || "preaaa";
        const bpPre2 = document.getElementById("bpPre2").value || "bb";
        const bpPost1 = document.getElementById("bpPost1").value || "postccc";
        const bpPost2 = document.getElementById("bpPost2").value || "ddd";
        text += "あり(BP:" + bpPre1 + "/" + bpPre2 + ", post:" + bpPost1 + "/" + bpPost2 + ")\n";
    } else {
        text += "なし\n";
    }

    text += "　呼吸止め　　　　" + document.getElementById("breath").value + "\n";
    text += "　使用造影剤　　　" + document.getElementById("contrast").value + "\n";
    text += "　造影剤使用量　　" + document.getElementById("volume").value + " CC\n\n";

    const segments = document.querySelectorAll(".stenosis-row");

    if(segments.length > 0){

        text += "■冠動脈\n\n";

        segments.forEach(row => {

            const seg = row.querySelector(".segment").value;
            const rate = row.querySelector(".rate").value;

            text += seg + ":" + rate + "\n\n";

        });

        text += "程度の狭窄が疑われます\n\n";
    }

    const findings = document.querySelectorAll(
        'input[type="checkbox"]:checked'
    );

    findings.forEach(item=>{
        text += "　" + item.value + "\n";
    });

    if(findings.length > 0){
        text += "\n";
    }

    const operator = document.getElementById("operator").value.trim();

    if(operator){
        text += "-----------------\n";
        text += operator + " 処理";
    }

    document.getElementById("output").value = text;
}

function copyReport(){

    const output = document.getElementById("output");

    output.select();
    navigator.clipboard.writeText(output.value);

    alert("コピーしました");
}

</script>

</body>
</html>
